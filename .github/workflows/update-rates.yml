name: Update Interest Rates

on:
  schedule:
    - cron: '0 0 * * *' # รันอัตโนมัติทุกเที่ยงคืน UTC (07:00 น. ตามเวลาไทย)
  workflow_dispatch: # เปิดให้กดปุ่มรันมือเองได้

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add accounts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update interest rates [skip ci]" && git push)
