<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เครื่องมือเปรียบเทียบดอกเบี้ยเงินฝากดิจิทัล</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4 sm:px-6">
  <div class="max-w-4xl mx-auto">
    <!-- ส่วนหัว -->
    <header class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold text-indigo-900 tracking-tight">เครื่องมือคำนวณดอกเบี้ยเงินฝากดิจิทัล</h1>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">เปรียบเทียบผลตอบแทนเงินฝากออมทรัพย์ดอกเบี้ยสูงแบบขั้นบันได</p>
      <div id="last-update" class="text-xs text-slate-400 mt-1">อัปเดตอัตโนมัติทุกวัน</div>
    </header>

    <!-- ช่องกรอกจำนวนเงิน -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8">
      <label for="deposit-amount" class="block text-sm font-semibold text-slate-700 mb-2">จำนวนเงินที่ต้องการฝาก (บาท)</label>
      <div class="relative rounded-xl shadow-inner">
        <input
          type="number"
          id="deposit-amount"
          value="100000"
          min="0"
          step="1000"
          placeholder="เช่น 100,000"
          class="w-full pl-4 pr-16 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-xl font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
        />
        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400 font-medium">บาท</div>
      </div>
      
      <!-- ปุ่มตัวเลือกยอดเงินด่วน -->
      <div class="flex flex-wrap gap-2 mt-4">
        <button onclick="setAmount(10000)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg text-xs font-medium text-slate-600 transition">10,000</button>
        <button onclick="setAmount(50000)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg text-xs font-medium text-slate-600 transition">50,000</button>
        <button onclick="setAmount(100000)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg text-xs font-medium text-slate-600 transition">100,000</button>
        <button onclick="setAmount(500000)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg text-xs font-medium text-slate-600 transition">500,000</button>
        <button onclick="setAmount(1000000)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg text-xs font-medium text-slate-600 transition">1,000,000</button>
      </div>
    </div>

    <!-- ตารางผลลัพธ์ -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
        <h2 class="font-semibold text-slate-800">ผลการเปรียบเทียบดอกเบี้ยต่อปี</h2>
        <span class="text-xs text-slate-500">เรียงตามดอกเบี้ยสุทธิสูงสุด</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="text-xs font-semibold text-slate-400 uppercase border-b border-slate-100 bg-slate-50/30">
              <th class="py-3 px-6">ธนาคาร / บัญชี</th>
              <th class="py-3 px-6 text-right">ดอกเบี้ยเฉลี่ย</th>
              <th class="py-3 px-6 text-right">ดอกเบี้ยรับต่อปี</th>
              <th class="py-3 px-6 text-right">ดอกเบี้ยรับต่อเดือน</th>
            </tr>
          </thead>
          <tbody id="result-tbody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="4" class="text-center py-8 text-slate-400">กำลังโหลดข้อมูลบัญชีเงินฝาก...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let accountsData = [];

    async function loadData() {
      try {
        const res = await fetch('accounts.json');
        if (!res.ok) throw new Error();
        const data = await res.json();
        accountsData = data.accounts || [];
        if (data.last_updated) {
          document.getElementById('last-update').innerText = `อัปเดตล่าสุด: ${data.last_updated}`;
        }
        calculate();
      } catch (err) {
        // ข้อมูลสำรองกรณีรันออฟไลน์
        accountsData = [
          {
            name: "Dime! Save",
            bank: "KKP",
            color: "bg-teal-500",
            tiers: [
              { max: 10000, rate: 3.00 },
              { max: 1000000, rate: 1.50 },
              { max: Infinity, rate: 0.50 }
            ]
          },
          {
            name: "KKP Start Up",
            bank: "KKP",
            color: "bg-purple-600",
            tiers: [
              { max: 50000, rate: 4.00 },
              { max: 1000000, rate: 1.50 },
              { max: Infinity, rate: 0.50 }
            ]
          },
          {
            name: "LHB You",
            bank: "LH Bank",
            color: "bg-blue-600",
            tiers: [
              { max: 100000, rate: 6.00 },
              { max: 1000000, rate: 1.75 },
              { max: Infinity, rate: 0.55 }
            ]
          },
          {
            name: "Kept (Grow)",
            bank: "Krungsri",
            color: "bg-yellow-500",
            tiers: [
              { max: 5000000, rate: 2.22 },
              { max: Infinity, rate: 0.25 }
            ]
          }
        ];
        calculate();
      }
    }

    function calculateTierInterest(amount, tiers) {
      let remaining = amount;
      let totalInterest = 0;
      let prevLimit = 0;

      for (let tier of tiers) {
        const tierCapacity = tier.max - prevLimit;
        const currentAmount = Math.min(remaining, tierCapacity);
        if (currentAmount > 0) {
          totalInterest += currentAmount * (tier.rate / 100);
          remaining -= currentAmount;
        }
        prevLimit = tier.max;
        if (remaining <= 0) break;
      }
      return totalInterest;
    }

    function calculate() {
      const amount = parseFloat(document.getElementById('deposit-amount').value) || 0;
      const tbody = document.getElementById('result-tbody');
      
      const results = accountsData.map(acc => {
        const interest = calculateTierInterest(amount, acc.tiers);
        const effectiveRate = amount > 0 ? (interest / amount) * 100 : 0;
        return {
          ...acc,
          interestYear: interest,
          interestMonth: interest / 12,
          effectiveRate: effectiveRate
        };
      });

      // เรียงตามดอกเบี้ยรับสูงสุด
      results.sort((a, b) => b.interestYear - a.interestYear);

      tbody.innerHTML = results.map((item, index) => `
        <tr class="hover:bg-slate-50/80 transition-colors">
          <td class="py-4 px-6 flex items-center gap-3">
            <span class="w-2 h-8 rounded-full ${item.color || 'bg-indigo-500'}"></span>
            <div>
              <div class="font-semibold text-slate-900">${item.name}</div>
              <div class="text-xs text-slate-400">${item.bank}</div>
            </div>
          </td>
          <td class="py-4 px-6 text-right font-medium text-slate-600">
            ${item.effectiveRate.toFixed(2)}%
          </td>
          <td class="py-4 px-6 text-right font-bold text-emerald-600">
            ฿${item.interestYear.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
          </td>
          <td class="py-4 px-6 text-right text-slate-500">
            ฿${item.interestMonth.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
          </td>
        </tr>
      `).join('');
    }

    function setAmount(val) {
      document.getElementById('deposit-amount').value = val;
      calculate();
    }

    document.getElementById('deposit-amount').addEventListener('input', calculate);
    loadData();
  </script>
</body>
</html>
